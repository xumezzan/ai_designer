# Production-like local stack: Postgres + Redis + API + Celery worker + Web.
# For quick development you can skip Docker entirely — see README.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: invito
      POSTGRES_PASSWORD: invito
      POSTGRES_DB: invito
    volumes: [pgdata:/var/lib/postgresql/data]
    ports: ["5432:5432"]

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]

  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: invito
      MINIO_ROOT_PASSWORD: invito123
    ports: ["9000:9000", "9001:9001"]
    volumes: [minio:/data]

  api:
    build: ./apps/api
    env_file: ./apps/api/.env.example
    environment:
      APP_ENV: production
      DATABASE_URL: postgresql+psycopg://invito:invito@db:5432/invito
      REDIS_URL: redis://redis:6379/0
      CELERY_EAGER: "false"
      STORAGE_BACKEND: s3
      S3_BUCKET: invito
      S3_ENDPOINT_URL: http://minio:9000
      S3_ACCESS_KEY_ID: invito
      S3_SECRET_ACCESS_KEY: invito123
      S3_PUBLIC_BASE_URL: http://localhost:9000/invito
      CORS_ORIGINS: http://localhost:3000
      PUBLIC_SITE_BASE_URL: http://localhost:3000
    # Schema is managed by Alembic — migrate before serving.
    command: sh -c "alembic upgrade head && exec uvicorn app.main:app --host 0.0.0.0 --port 8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 5s
      timeout: 3s
      retries: 24
    depends_on: [db, redis, minio]
    ports: ["8000:8000"]

  worker:
    build: ./apps/api
    command: celery -A app.workers.celery_app.celery_app worker --loglevel=info
    env_file: ./apps/api/.env.example
    environment:
      APP_ENV: production
      DATABASE_URL: postgresql+psycopg://invito:invito@db:5432/invito
      REDIS_URL: redis://redis:6379/0
      CELERY_EAGER: "false"
      STORAGE_BACKEND: s3
      S3_BUCKET: invito
      S3_ENDPOINT_URL: http://minio:9000
      S3_ACCESS_KEY_ID: invito
      S3_SECRET_ACCESS_KEY: invito123
      S3_PUBLIC_BASE_URL: http://localhost:9000/invito
    depends_on:
      api:
        condition: service_healthy

  web:
    build: ./apps/web
    environment:
      API_URL: http://api:8000
    depends_on: [api]
    ports: ["3000:3000"]

volumes:
  pgdata:
  minio:
